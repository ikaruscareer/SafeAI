name: GitHub Action tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    name: Validate the SafeAI GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --require-hashes -r requirements-build.txt

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify wheel package data and metadata
        run: |
          WHEEL=$(find dist -name '*.whl' | head -n 1)
          echo "$WHEEL"
          python scripts/check_wheel.py "$WHEEL"

      # Install the locally built wheel so the composite action can drive it.
      - name: Install the built SafeAI wheel
        run: pip install dist/*.whl

      # The composite action normally installs SafeAI from PyPI. For this test we
      # have already installed the locally built wheel above, so we skip the
      # action's own PyPI install (SAFEAI_ACTION_SKIP_INSTALL) and let it drive
      # the installed wheel. This keeps the test hermetic and independent of any
      # published PyPI version.
      - name: Run SafeAI action against a clean fixture
        uses: ./
        id: clean
        env:
          SAFEAI_ACTION_SKIP_INSTALL: "true"
        with:
          path: tests/fixtures/action/clean
          fail-on: critical
          sarif: clean.sarif
          scorecard: clean-scorecard.md
          scorecard-json: clean-scorecard.json
          scorecard-summary: "true"

      - name: Run SafeAI action against a deliberately risky fixture
        uses: ./
        id: risky
        continue-on-error: true
        env:
          SAFEAI_ACTION_SKIP_INSTALL: "true"
        with:
          path: tests/fixtures/action/risky
          fail-on: critical
          sarif: risky.sarif
          scorecard: risky-scorecard.md
          scorecard-json: risky-scorecard.json
          scorecard-summary: "true"

      - name: Assert risky fixture failed as expected
        if: always()
        run: |
          if [ "${{ steps.risky.outcome }}" != "failure" ]; then
            echo "Expected the risky fixture to fail with a non-zero exit code."
            exit 1
          fi

      - name: Validate SARIF artifacts
        if: always()
        run: |
          python - <<'PY'
          import json, os
          for name in ("clean.sarif", "risky.sarif"):
              assert os.path.exists(name), f"missing {name}"
              with open(name, encoding="utf-8") as fh:
                  doc = json.load(fh)
              assert doc["version"] == "2.1.0", f"{name} is not SARIF 2.1.0"
              assert doc["runs"], f"{name} has no runs"
              print(f"{name}: SARIF 2.1.0 OK ({len(doc['runs'][0].get('results', []))} results)")
          PY

      - name: Assert SARIF is preserved after policy failure
        if: always()
        run: |
          python - <<'PY'
          import json
          with open("risky.sarif", encoding="utf-8") as fh:
              doc = json.load(fh)
          results = doc["runs"][0].get("results", [])
          rules = doc["runs"][0]["tool"]["driver"].get("rules", [])
          ids = {r.get("id") for r in rules}
          assert "CAP_subprocess_shell" in ids, ids
          assert results, "expected findings in risky SARIF"
          print(f"risky SARIF survives failure with {len(results)} findings")
          PY

      - name: Assert sarif-path output is exposed to consumers
        if: always()
        run: |
          test -n "${{ steps.clean.outputs.sarif-path }}" \
            || { echo "::error::sarif-path output is empty (composite output mapping missing)"; exit 1; }
          test -f "${{ steps.clean.outputs.sarif-path }}" \
            || { echo "::error::sarif-path points to a missing file"; exit 1; }
          echo "sarif-path output OK: ${{ steps.clean.outputs.sarif-path }}"

      - name: Assert scorecard-path output is exposed to consumers
        if: always()
        run: |
          test -n "${{ steps.clean.outputs.scorecard-path }}" \
            || { echo "::error::scorecard-path output is empty (composite output mapping missing)"; exit 1; }
          test -f "${{ steps.clean.outputs.scorecard-path }}" \
            || { echo "::error::scorecard-path points to a missing file"; exit 1; }
          echo "scorecard-path output OK: ${{ steps.clean.outputs.scorecard-path }}"

      - name: Validate scorecard JSON artifacts
        if: always()
        run: |
          python - <<'PY'
          import json, os
          for name in ("clean-scorecard.json", "risky-scorecard.json"):
              assert os.path.exists(name), f"missing {name}"
              with open(name, encoding="utf-8") as fh:
                  doc = json.load(fh)
              assert "safeai_security_scorecard" in doc, f"{name} missing scorecard key"
              sc = doc["safeai_security_scorecard"]
              assert sc["schema_version"] == 1, f"{name} schema_version != 1"
              assert "summary" in sc, f"{name} missing summary"
              assert "score" in sc["summary"], f"{name} missing score"
              assert "status" in sc["summary"], f"{name} missing status"
              assert "categories" in sc, f"{name} missing categories"
              print(f"{name}: scorecard OK (score={sc['summary']['score']}, status={sc['summary']['status']})")
          PY

      - name: Validate scorecard Markdown artifacts
        if: always()
        run: |
          python - <<'PY'
          import os
          for name in ("clean-scorecard.md", "risky-scorecard.md"):
              assert os.path.exists(name), f"missing {name}"
              with open(name, encoding="utf-8") as fh:
                  content = fh.read()
              assert "# SafeAI Security Scorecard" in content, f"{name} missing title"
              assert "## Category scores" in content, f"{name} missing category scores"
              assert "## Severity distribution" in content, f"{name} missing severity distribution"
              print(f"{name}: Markdown scorecard OK ({len(content)} bytes)")
          PY

      - name: Assert scorecard preserved after policy failure
        if: always()
        run: |
          python - <<'PY'
          import json
          with open("risky-scorecard.json", encoding="utf-8") as fh:
              doc = json.load(fh)
          sc = doc["safeai_security_scorecard"]
          assert sc["summary"]["status"] == "fail", f"expected fail status, got {sc['summary']['status']}"
          assert sc["summary"]["blocking_findings"] > 0, "expected blocking findings"
          print(f"risky scorecard survives failure with status={sc['summary']['status']}")
          PY

  suite:
    name: Existing SafeAI test suite
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Ruff
        run: ruff check safeai/ tests/ scripts/

      - name: Test
        run: python -m pytest tests/ -v --tb=short