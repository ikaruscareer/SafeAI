name: SafeAI Fuzz Smoke

on:
  pull_request:
    paths:
      - 'community-scans/scripts/**'
      - 'community-scans/*.json'
      - 'community-scans/*.yml'
      - 'fuzz/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: P0 parser and sanitiser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out SafeAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # atheris==2.3.0 publishes/supports CPython through 3.11.
          python-version: '3.11'
      - name: Install fuzz dependencies
        run: "python -m pip install --only-binary=:all: -r fuzz/requirements.txt"
      - name: Fuzz public report sanitisation
        run: |
          timeout 60s python fuzz/fuzz_sanitise_report.py || test "$?" -eq 124
      - name: Fuzz report schema parsing
        run: |
          timeout 60s python fuzz/fuzz_report_schema.py || test "$?" -eq 124
      - name: Fuzz target manifest parsing
        run: |
          timeout 60s python fuzz/fuzz_targets_manifest.py || test "$?" -eq 124
