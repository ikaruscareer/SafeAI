name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.1)"
        required: true

permissions: read-all

jobs:
  # ── Gate 1: Pre-release checklist ────────────────────────────────────
  checklist:
    name: Pre-release checklist
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract metadata
        id: meta
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install pytest pytest-cov

      - name: "Check: canonical release checklist"
        run: python scripts/check_release.py

      - name: "Check: version string matches tag"
        run: |
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          CODE_VERSION=$(python -c "from safeai.version import SAFEAI_VERSION; print(SAFEAI_VERSION)")
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != code version ($CODE_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: "Check: all rules have required fields"
        run: |
          python -c "
          import yaml, sys
          with open('safeai/rules/base_rules.yaml') as f:
              rules = yaml.safe_load(f)
          required = {'id', 'severity', 'description'}
          bad = [r for r in rules if not required.issubset(r.keys())]
          if bad:
              for r in bad:
                  print(f'Missing fields in rule: {r.get(\"id\", \"UNKNOWN\")}')
              sys.exit(1)
          print(f'All {len(rules)} rules have required fields')
          "

      - name: "Check: compatibility tests pass"
        run: python -m pytest tests/test_compatibility.py -q --tb=short

      - name: "Check: fixture coverage completeness"
        run: |
          python -c "
          import os
          FIXTURES = 'tests/fixtures'
          from safeai.frameworks import discover_parsers
          parsers = discover_parsers()
          frameworks = set()
          for parser in parsers:
              for test_file, test_content in [('test.py', ''), ('test.json', '{}'), ('test.yaml', '')]:
                  result = parser.parse(test_file, test_content)
                  if isinstance(result, dict) and 'framework' in result:
                      frameworks.add(result['framework'])
                      break
          # Map framework names to fixture directory names
          FRAMEWORK_TO_FIXTURE = {'microsoft_agent_framework': 'microsoft_agent'}
          with_fixtures = set()
          for entry in os.scandir(FIXTURES):
              if entry.is_dir() and entry.name not in ('mcp', 'action', 'regression', 'claude_code'):
                  rep = os.path.join(entry.path, 'representative')
                  if os.path.isdir(rep):
                      # Check if this directory name maps to a framework name
                      mapped = False
                      for fw_name, fw_dir in FRAMEWORK_TO_FIXTURE.items():
                          if entry.name == fw_dir:
                              with_fixtures.add(fw_name)
                              mapped = True
                              break
                      if not mapped:
                          with_fixtures.add(entry.name)
          if os.path.isdir(os.path.join(FIXTURES, 'claude_code', 'compatibility')):
              with_fixtures.add('claude_code')
          missing = frameworks - with_fixtures
          if missing:
              print(f'Frameworks missing golden fixtures: {sorted(missing)}')
              exit(1)
          print(f'All {len(frameworks)} frameworks have golden fixtures')
          "

      - name: "Check: support-matrix consistency"
        run: |
          python -c "
          import re, yaml
          # Read SUPPORT_MATRIX.md
          with open('docs/reference/SUPPORT_MATRIX.md') as f:
              content = f.read()
          # Extract adapter names from the Framework Adapters table only
          # Find the table between "## Framework Adapters" and the next "##"
          framework_section = re.search(r'## Framework Adapters\n(.*?)(?=\n## |\Z)', content, re.DOTALL)
          if framework_section:
              adapter_pattern = r'\| \x60([a-z0-9_]+)\x60 \|'
              matrix_adapters = set(re.findall(adapter_pattern, framework_section.group(1)))
          else:
              matrix_adapters = set()
          # Extract adapter names from registered parsers
          from safeai.frameworks import discover_parsers
          parsers = discover_parsers()
          code_adapters = set()
          for parser in parsers:
              result = parser.parse('test.py', '')
              if isinstance(result, dict) and 'framework' in result:
                  code_adapters.add(result['framework'])
              elif hasattr(parser, 'name'):
                  code_adapters.add(parser.name)
          # Compare
          missing_in_matrix = code_adapters - matrix_adapters
          missing_in_code = matrix_adapters - code_adapters
          if missing_in_matrix:
              print(f'Adapters in code but not in SUPPORT_MATRIX.md: {sorted(missing_in_matrix)}')
              exit(1)
          if missing_in_code:
              print(f'Adapters in SUPPORT_MATRIX.md but not in code: {sorted(missing_in_code)}')
              exit(1)
          print(f'SUPPORT_MATRIX.md is consistent with {len(code_adapters)} adapters')
          # Check Action inputs
          with open('action.yml') as f:
              action = yaml.safe_load(f)
          action_inputs = set(action['inputs'].keys())
          # Extract input names from SUPPORT_MATRIX.md
          input_pattern = r'\| \x60([a-z-]+)\x60 \|'
          matrix_inputs = set(re.findall(input_pattern, content))
          missing_inputs = action_inputs - matrix_inputs
          if missing_inputs:
              print(f'Action inputs in code but not in SUPPORT_MATRIX.md: {sorted(missing_inputs)}')
              exit(1)
          print(f'SUPPORT_MATRIX.md Action inputs are consistent')
          "

      - name: "Check: SARIF output is valid"
        run: |
          python -c "
          from safeai.engine.scan import run_scan
          from safeai.report.sarif import write_sarif
          import json, tempfile, os
          report = run_scan('tests/fixtures/crewai/representative')
          path = os.path.join(tempfile.mkdtemp(), 'test.sarif')
          write_sarif(report, path)
          data = json.loads(open(path).read())
          assert data['version'] == '2.1.0', 'Invalid SARIF version'
          assert len(data['runs']) >= 1, 'No SARIF runs'
          print('SARIF output valid')
          "

      - name: "Check: JSON report has required keys"
        run: |
          python -c "
          from safeai.engine.scan import run_scan
          report = run_scan('tests/fixtures/crewai/representative')
          required = ['findings', 'counts', 'detected_frameworks', 'tool_surface', 'assurance_boundary']
          missing = [k for k in required if k not in report]
          if missing:
              print(f'Missing keys: {missing}')
              exit(1)
          print(f'JSON report has all {len(required)} required keys')
          "

      - name: "Check: Action I/O contract stable"
        run: |
          python -c "
          import yaml
          with open('action.yml') as f:
              action = yaml.safe_load(f)
          inputs = set(action['inputs'].keys())
          outputs = set(action['outputs'].keys())
          expected_inputs = {'path','version','fail-on','sarif','rules','baseline','fail-on-new','fail-on-escalation','no-registry','extra-args','scorecard','scorecard-json','scorecard-summary','scorecard-fail-under','pr-comment-post'}
          expected_outputs = {'sarif-path','scorecard-path','safeai-version'}
          missing_i = expected_inputs - inputs
          missing_o = expected_outputs - outputs
          if missing_i:
              print(f'Missing Action inputs: {missing_i}')
              exit(1)
          if missing_o:
              print(f'Missing Action outputs: {missing_o}')
              exit(1)
          print(f'Action I/O contract stable: {len(inputs)} inputs, {len(outputs)} outputs')
          "

      - name: "Check: failure_class_matrix present"
        run: |
          python -c "
          from safeai.engine.scan import run_scan
          from safeai.report.failure_matrix import build_failure_class_matrix
          report = run_scan('tests/fixtures/crewai/representative')
          matrix = build_failure_class_matrix(report.get('findings', []))
          assert len(matrix) > 0, 'Empty failure class matrix'
          print(f'Failure class matrix: {len(matrix)} classes')
          "

      - name: "Check: CHANGELOG has entry for this version"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if ! grep -q "\[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for v$VERSION"
            exit 1
          fi
          echo "CHANGELOG entry found for v$VERSION"

  # ── Gate 2: Build ────────────────────────────────────────────────────
  build:
    name: Build package
    needs: checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checklist.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install --require-hashes -r requirements-build.txt
          pip install twine

      - name: Build package
        run: python -m build

      - name: Verify package metadata
        run: |
          python -m twine check dist/*
          echo "Package metadata valid"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ── Gate 3: Checksums + SBOM + Provenance ────────────────────────────
  attest:
    name: Generate artifacts
    needs: [checklist, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checklist.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate SBOM
        run: python scripts/generate_release_artifacts.py ${{ needs.checklist.outputs.version }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          echo "Checksums generated:"
          cat SHA256SUMS

      - name: Generate SLSA provenance
        run: |
          TAG="${{ needs.checklist.outputs.version }}"
          SHA="${{ needs.checklist.outputs.sha }}"
          cat > dist/provenance.json << PROV
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{"name": "safeai-${TAG}.tar.gz", "digest": {"sha1": "${SHA}"}}],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildType": "https://github.com/ikaruscareer/SafeAI/.github/workflows/release.yml",
              "externalParameters": {
                "source": {"uri": "git+https://github.com/ikaruscareer/SafeAI@${SHA}", "digest": {"sha1": "${SHA}"}}
              },
              "metadata": {
                "buildInvocationId": "${{ github.run_id }}",
                "completeness": {"parameters": true, "environment": false, "materials": false}
              }
            }
          }
          PROV

      - name: Upload attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: |
            release-artifacts/
            dist/SHA256SUMS
            dist/provenance.json
          retention-days: 5

  # ── Gate 4: Sign + Attest ────────────────────────────────────────────
  sign:
    name: Sigstore-sign artifacts
    needs: [checklist, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checklist.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations
          path: attestations/

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Prepare release assets
        run: |
          mkdir -p signed
          cp dist/*.whl dist/*.tar.gz signed/
          cp attestations/dist/SHA256SUMS signed/
          cp attestations/dist/provenance.json signed/
          for f in attestations/release-artifacts/*.spdx.json; do
            [ -f "$f" ] || continue
            cp "$f" signed/
          done
          echo "Release assets:"
          ls -la signed/

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: signed/
          retention-days: 5

  # ── Gate 5: Publish to PyPI ─────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [checklist, sign]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checklist.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --require-hashes -r requirements-build.txt

      - name: Build package (pinned to release SHA)
        run: |
          echo "Building from SHA: ${{ needs.checklist.outputs.sha }}"
          git checkout ${{ needs.checklist.outputs.sha }}
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/

  # ── Gate 6: Upload to GitHub Release ─────────────────────────────────
  release:
    name: Upload to GitHub Release
    needs: [checklist, sign, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: signed/

      - name: Download attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations
          path: attestations/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checklist.outputs.version }}
        run: |
          TAG="v${TAG}"
          # Upload signed artifacts
          for f in signed/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber 2>/dev/null || true
          done
          # Upload SBOM
          for f in attestations/release-artifacts/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber 2>/dev/null || true
          done
          # Upload provenance
          gh release upload "$TAG" attestations/dist/provenance.json --clobber 2>/dev/null || true
          echo "All artifacts uploaded to release $TAG"
