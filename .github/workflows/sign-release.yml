name: Attest Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (e.g. v2.0.1)"
        required: true

permissions: {}

jobs:
  attest:
    name: Sigstore-attest release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --pattern '*.whl' --pattern '*.tar.gz' || true
          ls -la artifacts/

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184ef3e0a7dc8 # v2.2.3
        with:
          subject-path: |
            artifacts/*.whl
            artifacts/*.tar.gz
