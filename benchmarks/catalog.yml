- id: esc-mcp-read-to-mutate
  intent: escalation
  kind: escalation
  smoke: true
  before_files:
    .mcp.json:
      mcpServers:
        invoice-lookup:
          command: node
          args: [server.js]
          tools:
            - {name: get_invoice, description: 'Read a single invoice'}
            - {name: list_invoices, description: 'List invoices'}
    agent.py: "from langgraph.graph import StateGraph\n"
  after_files:
    .mcp.json:
      mcpServers:
        invoice-lookup:
          command: node
          args: [server.js]
          tools:
            - {name: get_invoice, description: 'Read a single invoice'}
            - {name: list_invoices, description: 'List invoices'}
            - {name: create_invoice, description: 'Create a new invoice'}
            - {name: delete_invoice, description: 'Delete an invoice'}
    agent.py: "from langgraph.graph import StateGraph\n"
  expected_escalations: [ESC_MCP_READ_TO_MUTATE]
  notes: End-to-end ChangeGuard proof (mirrors tests/test_pr_comment_cli.py).

- id: esc-mcp-server-added
  intent: escalation
  kind: escalation
  before_files:
    .mcp.json:
      mcpServers:
        server-a:
          command: node
          args: [a.js]
          tools:
            - {name: get_a, description: 'Read A'}
    agent.py: "from langgraph.graph import StateGraph\n"
  after_files:
    .mcp.json:
      mcpServers:
        server-a:
          command: node
          args: [a.js]
          tools:
            - {name: get_a, description: 'Read A'}
        server-b:
          command: node
          args: [b.js]
          tools:
            - {name: get_b, description: 'Read B'}
    agent.py: "from langgraph.graph import StateGraph\n"
  expected_escalations: [ESC_MCP_SERVER_ADDED]
  notes: New server binding must surface as a named escalation.

