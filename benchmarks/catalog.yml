# SafeAI benchmark catalog v1.0 — pinned, reproducible, offline.
#
# Each entry is evaluated by scripts/run_benchmarks.py. Expectations were
# captured from real scans (see BENCHMARKS.md); update them only
# intentionally, with the reason recorded in the entry's `notes`.
#
# intent: positive | negative | regression | limitation | escalation
# kind:   scan (single directory) | escalation (before/after pair)
# `path` is repo-relative. `files` / `before_files` / `after_files` are
# inline synthetic fixtures materialized to temp dirs (no secrets, ever).

- id: claude-code-deny-allow
  intent: positive
  kind: scan
  smoke: true
  path: tests/fixtures/regression/claude_code_deny_allow
