[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SafeAI-Static-Analyzer"
# The version is the single source of truth in ``safeai/__init__.py``
# (``__version__``). Reading it dynamically here prevents the pyproject and
# package versions from drifting apart on a version bump.
dynamic = ["version"]
description = "The lightweight, open-source Static AI Capability & Risk Analyzer for CI/CD pipelines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "IkarusCareer" },
]
keywords = ["ai-security", "static-analysis", "llm", "agents", "mcp", "sarif"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.1,<0.17",
    "jinja2>=3.1.4",
    "jsonschema>=4.22.0",
    "typing-extensions>=4.4.0",
]

[project.urls]
Homepage = "https://safeai-analyzer.ikaruscareer.com"
Repository = "https://github.com/ikaruscareer/SafeAI"
Issues = "https://github.com/ikaruscareer/SafeAI/issues"

[project.scripts]
safeai = "safeai.cmd.cli:main"

# Third-party parser packages can expose classes through this group.
# Built-in parsers are loaded directly by safeai.frameworks.
[project.entry-points."safeai.parsers"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "RUF012"]
extend-per-file-ignores = { "tests/fixtures/action/**" = ["I001", "F841", "PLW1510", "T201"] }

[tool.setuptools.packages.find]
include = ["safeai*"]

[tool.setuptools.dynamic]
version = {attr = "safeai.__version__"}

[tool.setuptools.package-data]
safeai = ["rules/*.yaml", "rules/*.yml"]
